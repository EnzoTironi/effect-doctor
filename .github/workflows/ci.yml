name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Build and smoke the packed CLI
        run: |
          npm run build
          VERSION=$(node dist/cli.js --version)
          test -n "$VERSION"
          node dist/cli.js fixtures/good --fail-on warning
          node dist/cli.js fixtures/bad --json --fail-on none > /tmp/ed.json
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('/tmp/ed.json','utf8')); if (r.schemaVersion!==1 || !r.diagnostics[0]?.id) process.exit(1)"
          npm pack --dry-run
